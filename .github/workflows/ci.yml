# CI: the project's test suites on every pull request and every push to main.
#
# Four jobs, so a red check names the part that broke: api, generator, ml, web.
# README.md, under "Continuous integration", says what this checks and what it does not
# (the Firefox end-to-end tests, lint, the published ML numbers).
#
# No secrets. Nothing here needs the FootyStats key, and it must never be added to CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # re-run by hand from the Actions tab

permissions:
  contents: read

# A new push to the same pull request cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"   # the API image's version (apps/api/Dockerfile)
  NODE_VERSION: "20"       # the web image's version (apps/web/Dockerfile)
  PYTHONIOENCODING: utf-8  # player names are Arabic and some test output prints them
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the service container above, not a secret.
      DATABASE_URL: postgresql+psycopg://northstar:northstar@localhost:5432/northstar
      # Where the search model (app/concepts.py) is kept, so the cache below can restore it.
      NORTHSTAR_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            data/pipelines/requirements.txt

      # The API suite imports the synthetic generator in a few tests (test_sports.py,
      # test_names.py), so it needs the generator's environment, which pulls in the API's own
      # pins. This is the environment CLAUDE.md tells everyone to build.
      - name: Install dependencies
        run: pip install -r data/pipelines/requirements.txt -r apps/api/requirements-dev.txt

      # The multilingual embedding model is about 240 MB. Without it the search-concept tests
      # skip; cached, they run on every PR without downloading it each time.
      - name: Cache the search model
        uses: actions/cache@v5
        with:
          path: .models
          # Keyed on the code that names the model and the pinned fastembed version, so a
          # model change downloads the new one instead of reusing a stale cache.
          key: fastembed-${{ hashFiles('apps/api/app/concepts.py', 'apps/api/requirements.txt') }}

      - name: Migrate the schema
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run the API tests
        working-directory: apps/api
        run: pytest -q -rs --junitxml="$RUNNER_TEMP/api.xml"

      # With no database the suite skips instead of failing (tests/conftest.py), so pytest
      # alone would report success having tested nothing. This turns that into a red check.
      - name: Check nothing skipped for lack of a database
        if: ${{ !cancelled() }}
        run: >-
          python .github/scripts/pytest_report.py "$RUNNER_TEMP/api.xml"
          --title "API tests" --fail-on-skip "No database at" --min-tests 100

  generator:
    name: generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            data/pipelines/requirements.txt
      - name: Install dependencies
        run: pip install -r data/pipelines/requirements.txt
      - name: Run the generator tests
        run: pytest -q -rs data/pipelines/synthetic/tests --junitxml="$RUNNER_TEMP/generator.xml"
      - name: Summarise
        if: ${{ !cancelled() }}
        run: python .github/scripts/pytest_report.py "$RUNNER_TEMP/generator.xml" --title "Generator tests"

  ml:
    name: ml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            data/pipelines/requirements.txt
            ml/requirements.txt
      - name: Install dependencies
        run: pip install -r data/pipelines/requirements.txt -r ml/requirements.txt
      - name: Run the ML tests
        run: pytest -q -rs ml/tests --junitxml="$RUNNER_TEMP/ml.xml"
      - name: Summarise
        if: ${{ !cancelled() }}
        run: python .github/scripts/pytest_report.py "$RUNNER_TEMP/ml.xml" --title "ML tests"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm workspaces: the lockfile is at the root. `npm ls` is not used as a check because it
      # exits non-zero on the deliberate postcss override (CLAUDE.md, "Known traps").
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
