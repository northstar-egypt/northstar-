# Python lint for the whole repo (API, pipelines, ML). Run from the root: ruff check .
# CI runs the same command (.github/workflows/ci.yml, job "lint").
#
# The rules find bugs, not style: pyflakes (unused imports and variables, undefined names),
# pycodestyle's error classes, and bugbear's likely-bug checks. No formatter is enforced, so
# nobody's code is rewritten to someone else's taste.
target-version = "py311"
extend-exclude = ["apps/web", "data/pipelines/synthetic/out"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # FastAPI's Depends(...) and Query(...) in default arguments are how the framework is
    # meant to be used, not the mutable-default bug this rule looks for.
    "B008",
    # zip(..., strict=...) is a style choice here; the lengths are checked where it matters.
    "B905",
]
