<text x="221.3" y="100.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="400">the size cut would release him.</text>
<text x="221.3" y="120.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600">Same day, from 5 readings, NorthStar</text>
<text x="221.3" y="136.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="400">flags him as a late bloomer.</text>
