<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="100%" style="max-width:820px" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">A late bloomer at the moment of the size cut</title>
<desc id="desc">Height readings of one synthetic boy, the date a size cut would have released him at age 14.2, the same date the system flagged him as a late bloomer, and the growth the generator planted for him afterwards.</desc>
<rect width="820" height="600" fill="#ffffff"/>
<text x="70.0" y="32.0" font-size="18" fill="#1f2937" text-anchor="start" font-weight="600">A late bloomer at the moment of the size cut</text>
<text x="70.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Height of one synthetic boy against his age group. Solid: measured. Dashed: the answer key, never measured.</text>
