<text x="786.0" y="198.0" font-size="12" fill="#0f766e" text-anchor="end" font-weight="600">Planted adult height 167.1 cm</text>
<text x="786.0" y="214.0" font-size="12" fill="#0f766e" text-anchor="end" font-weight="400">2.1 cm below the median for men aged 21</text>
<text x="70.0" y="466.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Filled points: readings the system had on the day of the cut. Hollow: measured after it.</text>
<text x="70.0" y="484.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">The synthetic data follows each player for at most 40 months, so the readings stop early.</text>
<text x="70.0" y="502.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Dashed: the growth the generator planted for him, maturity delayed 2.37 years. A real deployment would not have this line.</text>
<text x="70.0" y="520.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Chosen by rule, not by eye (seed 20260827): of the flagged football late bloomers the size cut reached,</text>
<text x="70.0" y="538.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">the one whose age at the cut is closest to 14. The rule is in ml/figure_late_bloomer.py.</text>
<text x="70.0" y="556.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Not every late bloomer is caught. Backtest over 5 datasets of 1000 players, at the moment of the cut:</text>
<text x="70.0" y="574.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">flagged 35 of 86 (41%) of late bloomers measured 3+ times, 31 of 140 (22%) of other small players,</text>
<text x="70.0" y="592.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">and 0 of 113 (0%) of late bloomers measured fewer times.</text>
</svg>
